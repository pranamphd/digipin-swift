name: CI — digipin-swift

on:
    push:
        branches: [main]
        paths:
            - "Sources/**"
            - "Tests/**"
            - "Package.swift"
            - ".github/workflows/ci.yml"
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    test:
        name: Build & Test (Swift ${{ matrix.swift }})
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                swift: ["5.10", "6.0", "6.1", "6.2"]

        env:
            SWIFT_VERSION: ${{ matrix.swift }}

        steps:
            - name: Checkout
              uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
              with:
                  fetch-depth: 0

            - name: Cache Swiftly
              id: cache-swiftly
              uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
              with:
                  path: |
                      ~/.swiftly
                      ~/.local/share/swiftly
                  key: swiftly-${{ runner.os }}-swift-${{ env.SWIFT_VERSION }}
                  restore-keys: |
                      swiftly-${{ runner.os }}-

            - name: Install Swift (Linux via Swiftly)
              if: steps.cache-swiftly.outputs.cache-hit != 'true'
              run: |
                  set -euxo pipefail

                  curl --proto '=https' -fsSL \
                      https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz \
                      -o swiftly.tar.gz

                  tar zxf swiftly.tar.gz
                  ./swiftly init --quiet-shell-followup -o -y

                  . "${SWIFTLY_HOME_DIR:-$HOME/.local/share/swiftly}/env.sh"
                  hash -r

                  swiftly install $SWIFT_VERSION || true
                  swiftly use $SWIFT_VERSION -g -y

            - name: Configure Swift PATH (Linux)
              run: |
                  echo "$HOME/.local/share/swiftly/bin" >> "$GITHUB_PATH"

            - name: Verify Swift toolchain
              run: swift --version

            # -------------------------------------------------
            # Core CI steps
            # -------------------------------------------------
            - name: Build (debug)
              run: swift build --configuration debug

            - name: Test
              run: swift test

            - name: Upload build artifacts (on failure)
              if: failure()
              uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # 7.0.0
              with:
                  name: swift-build-${{ runner.os }}
                  path: |
                      .build/
