name: CI — digipin-swift

on:
    push:
        branches: [main]
        paths:
            - "Sources/**"
            - "Tests/**"
            - "Package.swift"
            - ".github/workflows/ci.yml"
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

env:
    SWIFT_VERSION: "6.2"

jobs:
    test:
        name: Build & Test
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
              with:
                  fetch-depth: 0

            - name: Cache Swiftly
              id: cache-swiftly
              uses: actions/cache@8b402f58fbc84540c8b491a91e594a4576fec3d7 # v5.0.2
              with:
                  path: |
                      ~/.swiftly
                      ~/.local/share/swiftly
                  key: swiftly-${{ runner.os }}-swift-${{ env.SWIFT_VERSION }}
                  restore-keys: |
                      swiftly-${{ runner.os }}-

            - name: Install Swift (Linux via Swiftly)
              if: steps.cache-swiftly.outputs.cache-hit != 'true'
              run: |
                  set -euxo pipefail

                  curl --proto '=https' -fsSL \
                      https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz \
                      -o swiftly.tar.gz

                  tar zxf swiftly.tar.gz
                  ./swiftly init --quiet-shell-followup -o -y

                  . "${SWIFTLY_HOME_DIR:-$HOME/.local/share/swiftly}/env.sh"
                  hash -r

                  swiftly install $SWIFT_VERSION || true
                  swiftly use $SWIFT_VERSION -g -y

            # -------------------------------------------------
            # Core CI steps
            # -------------------------------------------------

            - name: Configure Swift PATH (Linux)
              run: |
                  echo "$HOME/.local/share/swiftly/bin" >> "$GITHUB_PATH"

            - name: Verify Swift toolchain
              run: swift --version

            - name: Cache SwiftPM
              uses: actions/cache@8b402f58fbc84540c8b491a91e594a4576fec3d7 # v5.0.2
              with:
                  path: .build
                  key: spm-${{ runner.os }}-${{ hashFiles('Package.swift') }}
                  restore-keys: |
                      spm-${{ runner.os }}-

            - name: Build (debug)
              run: swift build --configuration debug

            - name: Test
              run: swift test --enable-test-discovery

            - name: Upload build artifacts (on failure)
              if: failure()
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # 6.0.0
              with:
                  name: swift-build-${{ runner.os }}
                  path: |
                      .build/
