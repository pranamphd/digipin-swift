name: CD — digipin-swift

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: publish-digipin-swift
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Build, Docs, Provenance & Release
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write
      attestations: write

    environment: production

    env:
      TEST_MODE: ${{ vars.TEST_MODE }}
      SWIFT_VERSION: "6.2"
      PACKAGE_NAME: Digipin

    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          fetch-depth: 0

      - name: Set tag
        run: |
          set -euo pipefail
          echo "TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      # -------------------------------------------------
      # Cache Swift toolchain (safe, version-pinned)
      # -------------------------------------------------
      - name: Cache Swiftly
        id: cache-swiftly
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306
        with:
          path: |
            ~/.swiftly
            ~/.local/share/swiftly
          key: swiftly-${{ runner.os }}-swift-${{ env.SWIFT_VERSION }}
          restore-keys: |
            swiftly-${{ runner.os }}-

      # -------------------------------------------------
      # Install Swift (only on cache miss)
      # -------------------------------------------------
      - name: Install Swift via Swiftly
        if: steps.cache-swiftly.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl --proto '=https' -fsSL \
            https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz \
            -o swiftly.tar.gz
          tar zxf swiftly.tar.gz
          ./swiftly init --quiet-shell-followup -o -y
          . "${SWIFTLY_HOME_DIR:-$HOME/.local/share/swiftly}/env.sh"
          swiftly install "$SWIFT_VERSION"
          swiftly use "$SWIFT_VERSION" -g -y

      - name: Configure Swift PATH
        run: echo "$HOME/.local/share/swiftly/bin" >> "$GITHUB_PATH"

      - name: Verify Swift
        run: swift --version

      # -------------------------------------------------
      # Build & Test (no .build cache)
      # -------------------------------------------------
      - name: Build (release)
        run: swift build --configuration release

      - name: Test
        run: swift test --enable-test-discovery

      # -------------------------------------------------
      # SBOM (SwiftPM native, best-effort)
      # -------------------------------------------------
      - name: Generate SwiftPM SBOM
        run: |
          set -euo pipefail
          swift package describe --type json \
            > digipin-swift-${TAG}-spm-sbom.json

      # -------------------------------------------------
      # DocC — offline archive (.doccarchive)
      # -------------------------------------------------
      - name: Generate DocC archive (offline)
        run: |
          set -euo pipefail
          swift package generate-documentation \
            --target $PACKAGE_NAME \
            --output-path ./${PACKAGE_NAME}.doccarchive \
            --source-service github \
            --source-service-base-url https://github.com/${{ github.repository }}/blob/${TAG} \
            --checkout-path "$(pwd)"

      - name: Zip DocC archive
        run: |
          set -euo pipefail
          zip -r digipin-swift-${TAG}.doccarchive.zip ${PACKAGE_NAME}.doccarchive

      # -------------------------------------------------
      # SLSA provenance
      # -------------------------------------------------
      - name: Attest build provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f
        with:
          subject-path: |
            Package.swift
            digipin-swift-${TAG}-spm-sbom.json

      # -------------------------------------------------
      # Release safety checks
      # -------------------------------------------------
      - name: Check if GitHub release already exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "RELEASE_EXISTS=true" >> "$GITHUB_ENV"
            echo "RELEASE_IS_DRAFT=$(gh release view "$TAG" --json isDraft -q '.isDraft')" >> "$GITHUB_ENV"
          else
            echo "RELEASE_EXISTS=false" >> "$GITHUB_ENV"
          fi

      - name: Abort if release already published
        if: env.RELEASE_EXISTS == 'true' && env.RELEASE_IS_DRAFT != 'true'
        run: |
          echo "ERROR: Release $TAG already exists and is published."
          echo "Refusing to modify an immutable release."
          exit 1

      - name: Detect pre-release
        run: |
          set -euo pipefail
          if [[ "$TAG" =~ -(alpha|beta|rc) ]]; then
            echo "IS_PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "IS_PRERELEASE=false" >> "$GITHUB_ENV"
          fi

      - name: Set prerelease flag
        run: |
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            echo "PRERELEASE=--prerelease" >> "$GITHUB_ENV"
          else
            echo "PRERELEASE=" >> "$GITHUB_ENV"
          fi
      - name: Detect release type
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          IFS='.-' read -r MAJOR MINOR PATCH _ <<< "$VERSION"

          echo "MAJOR=$MAJOR" >> "$GITHUB_ENV"
          echo "MINOR=$MINOR" >> "$GITHUB_ENV"
          echo "PATCH=$PATCH" >> "$GITHUB_ENV"

          if [[ "$PATCH" == "0" && "$MINOR" == "0" ]]; then
            echo "RELEASE_TYPE=major" >> "$GITHUB_ENV"
          elif [[ "$PATCH" == "0" ]]; then
            echo "RELEASE_TYPE=minor" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TYPE=patch" >> "$GITHUB_ENV"
          fi

      - name: Compute notes start tag
        if: env.IS_PRERELEASE != 'true'
        run: |
          set -euo pipefail
          {
            case "$RELEASE_TYPE" in
              major) echo "START_TAG=v${MAJOR}.0.0" ;;
              minor) echo "START_TAG=v${MAJOR}.${MINOR}.0" ;;
              patch)
                if [[ "$PATCH" -gt 0 ]]; then
                  echo "START_TAG=v${MAJOR}.${MINOR}.$((PATCH-1))"
                fi
              ;;
            esac
          } >> "$GITHUB_ENV"

      # -------------------------------------------------
      # Create & publish GitHub release
      # -------------------------------------------------
      - name: Create GitHub release (draft)
        if: env.RELEASE_EXISTS != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" \
            --draft \
            $PRERELEASE \
            --title "$TAG" \
            --generate-notes

      # -------------------------------------------------
      # Generate DocC (static, latest only)
      # -------------------------------------------------
      - name: Generate DocC (static, latest)
        if: env.TEST_MODE != 'true' && env.IS_PRERELEASE != 'true'
        run: |
          set -euo pipefail

          rm -rf site
          mkdir -p site

          swift package \
            --allow-writing-to-directory site \
            generate-documentation \
            --target "${PACKAGE_NAME}" \
            --disable-indexing \
            --transform-for-static-hosting \
            --hosting-base-path "digipin-swift" \
            --output-path site

      # -------------------------------------------------
      # Publish latest docs to gh-pages
      # -------------------------------------------------
      - name: Publish docs to gh-pages
        if: env.TEST_MODE != 'true' && env.IS_PRERELEASE != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git status
          git stash push -u -m "docc-site" -- site
          git fetch origin gh-pages || true

          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
          fi

          ls -lah

          git rm -rf . || true
          git clean -fdx

          git checkout origin/main -- .gitignore
          git status

          git stash pop
          git status

          cp -R site/. .
          rm -rf site
          ls -lah

          test -f index.html

          git add .
          git status

          if git diff --cached --quiet; then
            echo "No documentation changes to publish."
            exit 0
          fi

          git commit -m "docs: publish latest DocC (${TAG})

          Triggered by: ${GITHUB_ACTOR}
          Workflow: ${GITHUB_WORKFLOW}
          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          git push origin gh-pages

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$TAG" \
            digipin-swift-${TAG}-spm-sbom.json \
            digipin-swift-${TAG}.doccarchive.zip

      - name: Publish GitHub release
        if: env.TEST_MODE != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$TAG" --draft=false
